[workspace]
resolver = "2"
members = [
    "crates/acas-common",
    "crates/acas-gl",
    "crates/acas-sales",
    "crates/acas-purchase",
    "crates/acas-stock",
    "crates/acas-irs",
]

[workspace.package]
